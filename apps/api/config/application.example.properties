server.port=8081

spring.datasource.url=${BUBIT_DB_URL}
spring.datasource.username=${BUBIT_DB_USERNAME}
spring.datasource.password=${BUBIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.bubit
mybatis.mapper-locations=classpath:com/bubit/**/*.xml

app.jwt.secret=${BUBIT_JWT_SECRET}
app.jwt.expiration-ms=${BUBIT_JWT_EXPIRATION_MS:3600000}
app.encryption.key=${BUBIT_ENCRYPTION_KEY}
app.cors.allowed-origins=${BUBIT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.upload.path=${BUBIT_UPLOAD_PATH:file:./uploads/}
app.upload.url=/files/**
app.coin.websocket.enabled=${BUBIT_COIN_WEBSOCKET_ENABLED:true}
